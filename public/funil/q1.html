<script data-purpose="option-selection-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.quiz-card');
      
      cards.forEach(card => {
        card.addEventListener('click', () => {
          // Add a brief tactile pulse animation
          card.classList.add('ring-2', 'ring-brand-blue', 'scale-[0.98]');
          setTimeout(() => {
            card.classList.remove('ring-2', 'ring-brand-blue', 'scale-[0.98]');
            // Ready for integration with next quiz slide or router step
          }, 180);
        });
      });
    });
  </script>
