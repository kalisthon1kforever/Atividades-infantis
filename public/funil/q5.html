<script data-purpose="option-selection-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const optionButtons = document.querySelectorAll('[data-purpose^="quiz-option-button"]');
      
      optionButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Visual select feedback

        });
      });
    });
